.seed:
  extends: .build
  variables:
    TARGET: seed

build:seed:
  extends: .seed
  stage: build
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^(\[Draft\]|\(Draft\)|Draft:)/
      changes: [packages/db/**/*, Dockerfile]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: manual

deploy:seed:
  extends: .seed
  stage: deploy
  interruptible: false
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^@churros\/db@(\d+\.\d+\.\d+)/
      variables:
        TAG: export TAG=$(echo $CI_COMMIT_TAG | sed 's/@churros\/db@//')
        DEPLOY: "true"